<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    (function() {
      try {
        var t = localStorage.getItem('daily-dive-theme');
        var isDark = t === 'dark';
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) {
          m.setAttribute('content', isDark ? '#1c1a17' : '#f7f3ec');
        }
      } catch (e) {}
    })();
  </script>
  <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
  <title>Daily Dive — Micro-learning on Demand</title>
  <meta name="description" content="A distraction-free, privacy-first single-page roulette application for daily micro-learning across tech, career, mental models, and world ideas.">
  
  <!-- Social Share Preview Metadata (Open Graph & Twitter Cards) -->
  <meta property="og:title" content="Daily Dive — Micro-learning on Demand">
  <meta property="og:description" content="A distraction-free, privacy-first single-page roulette application for daily micro-learning across tech, career, mental models, and world ideas.">
  <meta property="og:image" content="https://daily-dive.vercel.app/og-image.jpg">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://daily-dive.vercel.app/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Daily Dive — Micro-learning on Demand">
  <meta name="twitter:description" content="A distraction-free, privacy-first single-page roulette application for daily micro-learning across tech, career, mental models, and world ideas.">
  <meta name="twitter:image" content="https://daily-dive.vercel.app/og-image.jpg">
  
  <!-- PWA Manifest & App Icons -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1c1a17">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Self-Hosted Critical Font Preload -->
  <link rel="preload" href="/fonts/inter-normal-400.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    :root {
      --bg-color: #f7f3ec;
      --text-color: #1c1a17;
      --card-bg: #ede7dc;
      --border-color: rgba(68, 64, 60, 0.15);
      --primary: #c2593f;
    }
    .dark {
      --bg-color: #1c1a17;
      --text-color: #f7f3ec;
      --card-bg: #262320;
      --border-color: rgba(214, 208, 199, 0.15);
      --primary: #e07153;
    }
    body {
      margin: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .skeleton-shell {
      max-width: 56rem;
      margin: 0 auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .skeleton-header {
      height: 3.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding: 0 1rem;
    }
    .skeleton-box {
      background-color: var(--card-bg);
      border-radius: 1rem;
      border: 1px solid var(--border-color);
      animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body class="bg-surface font-sans text-on-surface antialiased min-h-screen flex flex-col selection:bg-primary-container selection:text-white">
  <div id="root">
    <div class="skeleton-header">
      <div style="font-weight: 700; font-size: 1.125rem; letter-spacing: -0.02em;">Daily Dive</div>
      <div style="width: 2rem; height: 2rem; border-radius: 9999px; background-color: var(--card-bg);"></div>
    </div>
    <div class="skeleton-shell">
      <div class="skeleton-box" style="height: 14rem; width: 100%;"></div>
      <div style="display: flex; gap: 0.5rem; justify-content: center;">
        <div class="skeleton-box" style="height: 2rem; width: 5rem; border-radius: 9999px;"></div>
        <div class="skeleton-box" style="height: 2rem; width: 6rem; border-radius: 9999px;"></div>
        <div class="skeleton-box" style="height: 2rem; width: 6rem; border-radius: 9999px;"></div>
      </div>
      <div class="skeleton-box" style="height: 3.25rem; width: 12rem; margin: 1rem auto; border-radius: 0.875rem;"></div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
